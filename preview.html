<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LINE風チャット</title>

  <style>
    body{
      margin:0;
      font-family:sans-serif;
      background:#cde7ff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .chat-box{
      width:350px;
      height:600px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 20px rgba(0,0,0,0.2);
      display:flex;
      flex-direction:column;
    }

    .header{
      background:#06c755;
      color:white;
      padding:15px;
      text-align:center;
      font-weight:bold;
      font-size:20px;
    }

    .messages{
      flex:1;
      padding:15px;
      overflow-y:auto;
      background:#e5ddd5;
    }

    .message{
      margin-bottom:10px;
      display:flex;
    }

    .left{
      justify-content:flex-start;
    }

    .right{
      justify-content:flex-end;
    }

    .bubble{
      max-width:70%;
      padding:10px 15px;
      border-radius:15px;
      font-size:14px;
    }

    .left .bubble{
      background:white;
    }

    .right .bubble{
      background:#06c755;
      color:white;
    }

    .input-area{
      display:flex;
      padding:10px;
      background:white;
      border-top:1px solid #ccc;
    }

    input{
      flex:1;
      padding:10px;
      border-radius:20px;
      border:1px solid #ccc;
      outline:none;
    }

    button{
      margin-left:10px;
      border:none;
      background:#06c755;
      color:white;
      padding:10px 15px;
      border-radius:20px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="chat-box">

  <div class="header">
    LINE風チャット
  </div>

  <div class="messages" id="messages">

    <div class="message left">
      <div class="bubble">こんにちは！</div>
    </div>

    <div class="message right">
      <div class="bubble">やあ！</div>
    </div>

  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="メッセージ入力">
    <button onclick="sendMessage()">送信</button>
  </div>

</div>

<script>
  function sendMessage(){
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    if(input.value.trim() === "") return;

    const msg = document.createElement("div");
    msg.className = "message right";

    msg.innerHTML = `
      <div class="bubble">${input.value}</div>
    `;

    messages.appendChild(msg);

    input.value = "";

    messages.scrollTop = messages.scrollHeight;
  }
</script>

</body>
</html>
